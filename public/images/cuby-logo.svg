  <title id="cuby-title">Cuby Digital</title>
  <desc id="cuby-description">Logo oficial cuby digital. Cubo e lettering cuby preservados em verde #B2DD4C. digital em minúsculas, na fonte Istok Web Italic regular, menor e mais leve. Inclinação ajustada a cuby e intervalo entre y e d equivalente ao espaçamento entre as letras da marca. Preto #22271E; fundo transparente; contornos vetoriais.</desc>
